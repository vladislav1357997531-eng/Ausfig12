<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<title>Ausfig12</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#11151d;--panel2:#0c1118;--line:#252d39;--text:#f5f7fa;--muted:#8f98a8;--accent:#caff3d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html{background:#090b10}
body{min-height:100vh;background:radial-gradient(circle at 90% -8%,rgba(202,255,61,.09),transparent 30rem),var(--bg);overscroll-behavior-y:none}
button,input,textarea{font:inherit}
.app{width:min(700px,100%);margin:auto;padding:calc(16px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 16px}
.brand{display:flex;align-items:center;gap:11px}.logo{width:44px;height:44px;border:1px solid rgba(202,255,61,.38);border-radius:14px;display:grid;place-items:center;color:var(--accent);font-weight:950;font-size:16px}.name{font-weight:900;font-size:22px;letter-spacing:-.035em}
.clearbtn{border:1px solid var(--line);background:rgba(17,21,29,.72);color:#b9c0cb;border-radius:12px;min-height:40px;padding:0 13px;font-weight:750;font-size:13px;cursor:pointer}
.card{background:linear-gradient(180deg,rgba(18,23,34,.98),rgba(13,18,26,.98));border:1px solid var(--line);border-radius:21px;padding:16px;margin-bottom:11px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.secret-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,.42fr);gap:12px}.group{min-width:0}.label{font-size:12px;font-weight:820;margin:0 0 8px;display:block;color:#dfe4eb}
.field{width:100%;border:1px solid #2b3442;background:#080d14;color:var(--text);outline:none;border-radius:15px;padding:14px 15px;font:inherit;transition:border-color .14s ease,box-shadow .14s ease,background .14s ease}.field:focus{border-color:rgba(202,255,61,.58);box-shadow:0 0 0 3px rgba(202,255,61,.075);background:#0a1018}.pin{letter-spacing:.14em}
textarea.field{min-height:190px;resize:vertical;line-height:1.5}.result{min-height:150px;max-height:310px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.45;word-break:break-all}
.result-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.result-head .label{margin:0}.copybtn{border:1px solid #303946;background:#151b24;color:#eef2f6;border-radius:11px;min-height:38px;padding:0 12px;font-weight:800;font-size:12px;cursor:pointer;transition:transform .1s ease,background .14s ease}.copybtn:active,.clearbtn:active,.mainbtn:active{transform:scale(.985)}
#resultCard{animation:resultIn .18s ease-out both;scroll-margin-bottom:100px}.hidden{display:none!important}
.actionbar{position:sticky;bottom:0;z-index:20;margin:2px -2px 0;padding:10px 2px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(9,11,16,0),rgba(9,11,16,.94) 25%,rgba(9,11,16,.98));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mainbtn{border:1px solid transparent;background:var(--accent);color:#090c10;border-radius:16px;min-height:54px;font-weight:900;font-size:15px;cursor:pointer;transition:transform .1s ease,opacity .15s ease,background .15s ease}.mainbtn.secondary{background:#161c25;color:#f1f4f7;border-color:#303845}.mainbtn:disabled{opacity:.58;cursor:default}.mainbtn.busy{position:relative}.mainbtn.busy:after{content:"";display:inline-block;width:13px;height:13px;margin-left:8px;vertical-align:-2px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes resultIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media(max-width:520px){.app{padding-left:10px;padding-right:10px}.card{border-radius:18px;padding:14px}.secret-grid{grid-template-columns:1fr}.name{font-size:21px}textarea.field{min-height:170px}.result{min-height:135px}.clearbtn{padding:0 11px}.actionbar{margin-left:-1px;margin-right:-1px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.mainbtn,.field,.copybtn{transition:none}#resultCard{animation:none}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">A12</div><div class="name">Ausfig12</div></div>
  <button id="clear" class="clearbtn" type="button">Очистить</button>
</header>

<div class="card">
  <div class="secret-grid">
    <div class="group">
      <label class="label" for="word">Кодовое слово</label>
      <input id="word" class="field" type="password" autocomplete="off" autocapitalize="none" spellcheck="false">
    </div>
    <div class="group">
      <label class="label" for="pin">PIN</label>
      <input id="pin" class="field pin" type="password" inputmode="numeric" autocomplete="off">
    </div>
  </div>
</div>

<div class="card">
  <label class="label" for="message">Сообщение</label>
  <textarea id="message" class="field" autocomplete="off" autocapitalize="sentences"></textarea>
</div>

<div id="resultCard" class="card hidden">
  <div class="result-head">
    <label class="label" for="result">Результат</label>
    <button id="copy" class="copybtn" type="button">Копировать</button>
  </div>
  <textarea id="result" class="field result" readonly spellcheck="false"></textarea>
</div>

<div class="actionbar">
  <div class="actions">
    <button id="encrypt" class="mainbtn" type="button">Зашифровать</button>
    <button id="decrypt" class="mainbtn secondary" type="button">Расшифровать</button>
  </div>
</div>
</div>
<script src="./argon2-bundled.min.js"></script>
<script>
(()=>{
'use strict';

const te=new TextEncoder();
const td=new TextDecoder('utf-8',{fatal:true});
const subtle=crypto.subtle;
const MAGIC=Uint8Array.of(65,70,49,50);
const VERSION5=5,SUITE5=21,VERSION4=4,SUITE4=19,HEADER=128,MAX_TEXT=8*1024*1024,MIN_BUCKET=1024,MIB=1024*1024,BLOCK=64;
const ARGON5={mem:65536,time:3,parallelism:4,hashLen:64};
const ARGON4={mem:65536,time:3,parallelism:4,hashLen:64};
const CTX5=te.encode('AUSFIG12/V5/CTX');
const CTX4=te.encode('AUSFIG12/V4/CTX');
const V5_LABELS=['SUB','SHUFFLE','MIX','AEAD','DECOY'].map(x=>te.encode('AUSFIG12/V5/'+x));
const V4_LABELS=['SUB','SHUFFLE','CTR-IN','GCM-IN','GCM-OUT','CTR-OUT','DECOY'].map(x=>te.encode('AUSFIG12/V4/'+x));
const PERM_SUB_LABEL=te.encode('AUSFIG12/V5/SUB-PERM');
const PERM_SHUF_LABEL=te.encode('AUSFIG12/V5/SHUFFLE-PERM');
const $=id=>document.getElementById(id);
let busy=false;

function cat(...parts){const n=parts.reduce((s,p)=>s+p.length,0),out=new Uint8Array(n);let o=0;for(const p of parts){out.set(p,o);o+=p.length}return out}
function u32(n){const b=new Uint8Array(4);new DataView(b.buffer).setUint32(0,n>>>0,false);return b}
function r32(b,o){return new DataView(b.buffer,b.byteOffset,b.byteLength).getUint32(o,false)}
function random(n){const out=new Uint8Array(n);for(let o=0;o<n;o+=65536)crypto.getRandomValues(out.subarray(o,Math.min(n,o+65536)));return out}
function same(a,b){if(a.length!==b.length)return false;let x=0;for(let i=0;i<a.length;i++)x|=a[i]^b[i];return x===0}
function wipe(...items){for(const x of items)if(x&&x.fill)x.fill(0)}
function secretFrame(word,pin,version){if(!word)throw new Error('Введите кодовое слово.');if(!/^\d{1,4096}$/.test(pin))throw new Error('Введите PIN цифрами.');const pfx=te.encode(`AUSFIG12\0FORTRESS\0V${version}`),w=te.encode(word.normalize('NFC')),p=te.encode(pin);return cat(pfx,u32(w.length),w,u32(p.length),p)}
function bucket(n){if(n<MIN_BUCKET)return MIN_BUCKET;if(n<MIB){let x=MIN_BUCKET;while(x<n)x*=2;return x}return Math.ceil(n/MIB)*MIB}

const CRC=(()=>{const t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=(c&1)?0xEDB88320^(c>>>1):c>>>1;t[i]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(const x of b)c=CRC[(c^x)&255]^(c>>>8);return u32((c^0xFFFFFFFF)>>>0)}

function b64urlEncode(data){let s='',step=0x8000;for(let i=0;i<data.length;i+=step)s+=String.fromCharCode(...data.subarray(i,i+step));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64urlDecode(text){const s=String(text).trim().replace(/\s+/g,'');if(!/^[A-Za-z0-9_-]+$/.test(s))throw new Error('Повреждённый формат.');const pad='='.repeat((4-s.length%4)%4);let bin;try{bin=atob(s.replace(/-/g,'+').replace(/_/g,'/')+pad)}catch{throw new Error('Повреждённый формат.')}const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}

async function argonMaster(secret,salt,params){if(!globalThis.argon2?.hash)throw Object.assign(new Error(''),{silent:true});const r=await argon2.hash({pass:secret,salt,time:params.time,mem:params.mem,hashLen:params.hashLen,parallelism:params.parallelism,type:argon2.ArgonType.Argon2id});return new Uint8Array(r.hash)}
async function hkdf(master,label,ctx){const k=await subtle.importKey('raw',master,'HKDF',false,['deriveBits']);return new Uint8Array(await subtle.deriveBits({name:'HKDF',hash:'SHA-512',salt:ctx,info:label},k,256))}
async function deriveKeys(master,ctx,labels){return Promise.all(labels.map(l=>hkdf(master,l,ctx)))}
async function aesKey(raw,alg,ops){return subtle.importKey('raw',raw,{name:alg},false,ops)}
async function ctr(raw,counter,data){const k=await aesKey(raw,'AES-CTR',['encrypt']);return new Uint8Array(await subtle.encrypt({name:'AES-CTR',counter,length:64},k,data))}
async function gcmEnc(raw,iv,data,aad){const k=await aesKey(raw,'AES-GCM',['encrypt']);return new Uint8Array(await subtle.encrypt({name:'AES-GCM',iv,additionalData:aad,tagLength:128},k,data))}
async function gcmDec(raw,iv,data,aad){const k=await aesKey(raw,'AES-GCM',['decrypt']);return new Uint8Array(await subtle.decrypt({name:'AES-GCM',iv,additionalData:aad,tagLength:128},k,data))}
async function hmac(raw,data){const k=await subtle.importKey('raw',raw,{name:'HMAC',hash:'SHA-256'},false,['sign']);return new Uint8Array(await subtle.sign('HMAC',k,data))}
async function sha256(data){return new Uint8Array(await subtle.digest('SHA-256',data))}

function permutationFromStream(n,stream){const p=Uint32Array.from({length:n},(_,i)=>i);if(n<2)return p;const dv=new DataView(stream.buffer,stream.byteOffset,stream.byteLength);let pos=0;for(let i=n-1;i>0;i--){const m=i+1,lim=Math.floor(0x100000000/m)*m;let x;do{if(pos+4>stream.length)throw new Error('Ошибка внутренней перестановки.');x=dv.getUint32(pos,false);pos+=4}while(x>=lim);const j=x%m,t=p[i];p[i]=p[j];p[j]=t}return p}
async function strongPermutation(n,key,label,ctx){if(n<2)return Uint32Array.from({length:n},(_,i)=>i);const d=await sha256(cat(ctx,label)),counter=d.slice(0,16),zeros=new Uint8Array(Math.max(1024,n*16)),stream=await ctr(key,counter,zeros);const p=permutationFromStream(n,stream);wipe(d,counter,zeros,stream);return p}
async function substitute5(data,key,ctx,inverse=false){const p=await strongPermutation(256,key,PERM_SUB_LABEL,ctx);if(!inverse){const out=new Uint8Array(data.length);for(let i=0;i<data.length;i++)out[i]=p[data[i]];return out}const inv=new Uint8Array(256);for(let i=0;i<256;i++)inv[p[i]]=i;const out=new Uint8Array(data.length);for(let i=0;i<data.length;i++)out[i]=inv[data[i]];wipe(inv);return out}
async function shuffle5(data,key,ctx,inverse=false){if(data.length%BLOCK)throw new Error('Неверный блок.');const count=data.length/BLOCK,p=await strongPermutation(count,key,PERM_SHUF_LABEL,ctx),out=new Uint8Array(data.length);for(let i=0;i<count;i++){const from=inverse?i:p[i],to=inverse?p[i]:i;out.set(data.subarray(from*BLOCK,(from+1)*BLOCK),to*BLOCK)}return out}

function header5(salt,id,nonce,mixCtr,tweak,body){const h=new Uint8Array(HEADER),v=new DataView(h.buffer);h.set(MAGIC,0);h[4]=VERSION5;h[5]=SUITE5;h[6]=0;h[7]=ARGON5.parallelism;v.setUint32(8,ARGON5.mem,false);v.setUint32(12,ARGON5.time,false);v.setUint32(16,body,false);v.setUint32(20,BLOCK,false);h.set(salt,24);h.set(id,56);h.set(nonce,72);h.set(mixCtr,84);h.set(tweak,100);return h}
function parseHeader5(h){if(h.length!==HEADER||!MAGIC.every((x,i)=>h[i]===x)||h[4]!==VERSION5||h[5]!==SUITE5||h[6]!==0)throw new Error('Неподдерживаемый Ausfig12.');const v=new DataView(h.buffer,h.byteOffset,h.byteLength),mem=v.getUint32(8,false),time=v.getUint32(12,false),body=v.getUint32(16,false),block=v.getUint32(20,false),par=h[7];if(mem!==ARGON5.mem||time!==ARGON5.time||par!==ARGON5.parallelism||block!==BLOCK||body<32||body>24*1024*1024)throw new Error('Повреждённый контейнер.');for(let i=116;i<128;i++)if(h[i]!==0)throw new Error('Повреждённый контейнер.');return{version:5,body,salt:h.slice(24,56),id:h.slice(56,72),nonce:h.slice(72,84),mixCtr:h.slice(84,100),tweak:h.slice(100,116)}}
function parseHeader4(h){if(h.length!==HEADER||!MAGIC.every((x,i)=>h[i]===x)||h[4]!==VERSION4||h[5]!==SUITE4)throw new Error('Неподдерживаемый Ausfig12.');const v=new DataView(h.buffer,h.byteOffset,h.byteLength),mem=v.getUint32(8,false),time=v.getUint32(12,false),body=v.getUint32(16,false),par=h[7];if(mem!==ARGON4.mem||time!==ARGON4.time||par!==ARGON4.parallelism||body<32||body>24*1024*1024)throw new Error('Повреждённый контейнер.');return{version:4,body,salt:h.slice(24,56),id:h.slice(56,72),ctrIn:h.slice(72,88),nIn:h.slice(88,100),nOut:h.slice(100,112),ctrOut:h.slice(112,128)}}
function openEnvelope(text){const bin=b64urlDecode(text);if(bin.length<HEADER+4)throw new Error('Контейнер обрезан.');const h=bin.slice(0,HEADER);if(!MAGIC.every((x,i)=>h[i]===x))throw new Error('Неподдерживаемый Ausfig12.');const meta=h[4]===VERSION5?parseHeader5(h):h[4]===VERSION4?parseHeader4(h):(()=>{throw new Error('Неподдерживаемая версия Ausfig12.')})();if(bin.length!==HEADER+meta.body+4)throw new Error('Контейнер повреждён.');const body=bin.slice(HEADER,HEADER+meta.body),check=bin.slice(HEADER+meta.body),transport=cat(h,body);if(!same(check,crc32(transport)))throw new Error('Контейнер повреждён.');wipe(transport);return{h,body,meta}}

async function decoy(key,h,body){const seed=await hmac(key,cat(h,body)),dv=new DataView(seed.buffer,seed.byteOffset,seed.byteLength);let a=dv.getUint32(0,true)||0x9e3779b9,b=dv.getUint32(4,true)||0x243f6a88,c=dv.getUint32(8,true)||0xb7e15162,d=dv.getUint32(12,true)||0xdeadbeef;const next=()=>{const t=(a^(a<<11))>>>0;a=b;b=c;c=d;d=(d^(d>>>19)^t^(t>>>8))>>>0;return d};const n=Math.max(48,Math.min(1536,Math.floor(body.length*.7))),out=new Uint8Array(n);for(let i=0;i<n;i++)out[i]=next()&255;wipe(seed);return b64urlEncode(out)}

async function encryptV5(text,word,pin){const msg=te.encode(String(text));if(!msg.length)throw new Error('Введите сообщение.');if(msg.length>MAX_TEXT)throw new Error('Сообщение слишком большое.');const sf=secretFrame(word,pin,5),salt=random(32),id=random(16),nonce=random(12),mixCtr=random(16),tweak=random(16),prefix=cat(Uint8Array.of(VERSION5,SUITE5,0,0),u32(msg.length)),target=bucket(prefix.length+msg.length);if(target%BLOCK)throw new Error('Ошибка размера блока.');const payload=cat(prefix,msg,random(target-prefix.length-msg.length)),bodyLen=payload.length+16,h=header5(salt,id,nonce,mixCtr,tweak,bodyLen),ctx=cat(CTX5,salt,id,tweak),master=await argonMaster(sf,salt,ARGON5),k=await deriveKeys(master,ctx,V5_LABELS);let x=null,transport=null,bin=null;try{x=await substitute5(payload,k[0],ctx);x=await shuffle5(x,k[1],ctx);x=await ctr(k[2],mixCtr,x);x=await gcmEnc(k[3],nonce,x,h);transport=cat(h,x);bin=cat(transport,crc32(transport));return b64urlEncode(bin)}finally{wipe(sf,master,payload,msg,ctx,x,transport,bin,...k)}}

async function decryptV5(h,body,meta,word,pin){const sf=secretFrame(word,pin,5),ctx=cat(CTX5,meta.salt,meta.id,meta.tweak),master=await argonMaster(sf,meta.salt,ARGON5),k=await deriveKeys(master,ctx,V5_LABELS);let x=null;try{x=await gcmDec(k[3],meta.nonce,body,h);x=await ctr(k[2],meta.mixCtr,x);x=await shuffle5(x,k[1],ctx,true);x=await substitute5(x,k[0],ctx,true);if(x.length<8||x[0]!==VERSION5||x[1]!==SUITE5||x[2]||x[3])throw 0;const n=r32(x,4);if(n>MAX_TEXT||8+n>x.length)throw 0;return td.decode(x.slice(8,8+n))}catch(_){return await decoy(k[4],h,body)}finally{wipe(sf,master,ctx,x,...k)}}

function prng4(seed){const dv=new DataView(seed.buffer,seed.byteOffset,seed.byteLength);let a=dv.getUint32(0,true)||0x9e3779b9,b=dv.getUint32(4,true)||0x243f6a88,c=dv.getUint32(8,true)||0xb7e15162,d=dv.getUint32(12,true)||0xdeadbeef;const next=()=>{const t=(a^(a<<11))>>>0;a=b;b=c;c=d;d=(d^(d>>>19)^t^(t>>>8))>>>0;return d};return n=>{const lim=Math.floor(0x100000000/n)*n;let x;do{x=next()}while(x>=lim);return x%n}}
function permutation4(n,seed){const rnd=prng4(seed),p=Uint32Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){const j=rnd(i+1),t=p[i];p[i]=p[j];p[j]=t}return p}
function substitute4(data,seed,inverse=false){const p=permutation4(256,seed);if(!inverse){const out=new Uint8Array(data.length);for(let i=0;i<data.length;i++)out[i]=p[data[i]];return out}const inv=new Uint8Array(256);for(let i=0;i<256;i++)inv[p[i]]=i;const out=new Uint8Array(data.length);for(let i=0;i<data.length;i++)out[i]=inv[data[i]];return out}
function shuffle4(data,seed,inverse=false){if(data.length%BLOCK)throw new Error('Неверный блок.');const count=data.length/BLOCK,p=permutation4(count,seed),out=new Uint8Array(data.length);for(let i=0;i<count;i++){const from=inverse?i:p[i],to=inverse?p[i]:i;out.set(data.subarray(from*BLOCK,(from+1)*BLOCK),to*BLOCK)}return out}
async function decryptV4(h,body,meta,word,pin){const sf=secretFrame(word,pin,4),ctx=cat(CTX4,meta.salt,meta.id),master=await argonMaster(sf,meta.salt,ARGON4),k=await deriveKeys(master,ctx,V4_LABELS);let x=null;try{x=await ctr(k[5],meta.ctrOut,body);x=await gcmDec(k[4],meta.nOut,x,h);x=await gcmDec(k[3],meta.nIn,x,h);x=await ctr(k[2],meta.ctrIn,x);x=shuffle4(x,k[1],true);x=substitute4(x,k[0],true);if(x.length<8||x[0]!==4||x[1]!==12||x[2]||x[3])throw 0;const n=r32(x,4);if(n>MAX_TEXT||8+n>x.length)throw 0;return td.decode(x.slice(8,8+n))}catch(_){return await decoy(k[6],h,body)}finally{wipe(sf,master,ctx,x,...k)}}
async function decryptAny(text,word,pin){const {h,body,meta}=openEnvelope(text);return meta.version===5?decryptV5(h,body,meta,word,pin):decryptV4(h,body,meta,word,pin)}

function loading(on,mode=''){busy=on;const enc=$('encrypt'),dec=$('decrypt');enc.disabled=dec.disabled=on;enc.classList.toggle('busy',on&&mode==='enc');dec.classList.toggle('busy',on&&mode==='dec');enc.textContent=on&&mode==='enc'?'Шифрую…':'Зашифровать';dec.textContent=on&&mode==='dec'?'Расшифровываю…':'Расшифровать'}
function showResult(value){$('result').value=value;const card=$('resultCard'),wasHidden=card.classList.contains('hidden');card.classList.remove('hidden');if(wasHidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(()=>card.scrollIntoView({behavior:'smooth',block:'nearest'}))}
async function run(mode){if(busy)return;loading(true,mode);await new Promise(r=>requestAnimationFrame(()=>r()));try{showResult(await(mode==='enc'?encryptV5($('message').value,$('word').value,$('pin').value):decryptAny($('message').value,$('word').value,$('pin').value)))}catch(e){showResult(e?.silent?'':(e?.message||'Ошибка выполнения.'))}finally{loading(false)}}
async function copy(){const v=$('result').value;if(!v)return;try{await navigator.clipboard.writeText(v)}catch{const t=document.createElement('textarea');t.value=v;t.style.cssText='position:fixed;opacity:0;pointer-events:none';document.body.append(t);t.select();document.execCommand('copy');t.remove()}const b=$('copy');b.textContent='Скопировано ✓';clearTimeout(copy.timer);copy.timer=setTimeout(()=>b.textContent='Копировать',1200)}
function clearAll(){if(busy)return;$('word').value='';$('pin').value='';$('message').value='';$('result').value='';$('resultCard').classList.add('hidden');$('copy').textContent='Копировать';$('word').focus({preventScroll:true})}

$('pin').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,''));
$('encrypt').addEventListener('click',()=>run('enc'));
$('decrypt').addEventListener('click',()=>run('dec'));
$('copy').addEventListener('click',copy);
$('clear').addEventListener('click',clearAll);
})();
</script>
<script>
if('serviceWorker' in navigator && location.protocol!=='file:'){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
